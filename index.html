ava-distance-unit"><option value="meters">Meters (Strava original export)</option><option value="km">Kilometres (converted CSV)</option><option value="miles">Miles</option></select></label>${lastImportSummary?`<div class="note-box" style="margin-top:12px">${e(lastImportSummary)}</div>`:''}<p class="small-note">For true automatic syncing, Strava requires OAuth authorization and a secure server component. TrailForge does not claim to have a live Strava connection.</p></section></div>`}

function showModal(type,id,misc){modal={type,id,misc};const html={workout:()=>modalWorkout(id),edit:()=>modalEditWorkout(id),move:()=>modalMove(id),scale:modalAdjustWeek,sick:modalSick,add:modalAddWorkout,log:()=>modalLog(id),editlog:()=>modalEditLog(id),reset:modalReset,restore:modalRestore}[type]?.()||'';let root=$('#modal-root');if(root){root.innerHTML=html;setTimeout(()=>root.querySelector('input,select,button.close')?.focus({preventScroll:true}),20)}}

function moveWorkout(id,target){let x=st.workouts.find(x=>x.id===id);if(!x||x.race||(x.status==='done'&&st.activities.some(a=>a.workoutId===x.id))||target<FIRST||target>RACE_A){toast('Cannot move this workout to that date.',true);return}const old=x.date;if(old===target){closeModal();return}const other=st.workouts.find(y=>y.id!==x.id&&y.date===target&&isTraining(y)&&y.status!=='done'&&!y.race);if(other){other.date=old;x.date=target;toast('Workouts swapped successfully.')}else{x.date=target;toast('Workout moved.')}weekN=affectedWeek(target);persist();closeModal();render();}
function toggleSkip(id){const x=st.workouts.find(w=>w.id===id);if(!x||x.race)return;if(x.status==='done'&&st.activities.some(a=>a.workoutId===x.id)){toast('Delete the logged activity before skipping it.',true);return}x.status=x.status==='skipped'?'planned':'skipped';x.skipReason=x.status==='skipped'?'missed':'';persist();closeModal();render();toast(x.status==='skipped'?'Workout skipped — no catch-up mileage.':'Workout restored.');}
function scaleWeek(week,ratio){let w=weeks[week-1],ws=weekWorkouts(w).filter(x=>isTraining(x)&&!x.race&&x.status==='planned');ws.forEach(x=>{x.km=nice(x.km*ratio);x.elev=Math.round(x.elev*ratio/5)*5;});}
function sickness(start,days){let end=plusDays(start,days-1);if(st.workouts.some(x=>x.race&&x.date>=start&&x.date<=end)){toast('Your illness window overlaps a race. Review your race participation and recovery manually.',true)}let count=0;for(let x of st.workouts){if(x.date>=start&&x.date<=end&&!x.race&&x.status==='planned'&&isTraining(x)){x.status='skipped';x.skipReason='illness';count++;}else if(x.date>=start&&x.date<=end&&x.type==='strength'&&x.status==='planned'){x.status='skipped';x.skipReason='illness';}}
if(days>=4){let after=plusDays(end,1),until=plusDays(end,7);st.workouts.filter(x=>x.date>=after&&x.date<=until&&x.status==='planned'&&!x.race).forEach(x=>{if(isTraining(x)){x.km=nice(x.km*.75);x.elev=Math.round(x.elev*.75/5)*5;if(x.type==='quality'){x.type='easy';x.title='Return-to-running easy session';x.description='No hard efforts after illness; build gradually only if fully recovered.'}}if(x.type==='strength')x.description='Light mobility only until fully recovered.'});}
st.illness.push({start,end,days});persist();closeModal();render();toast(`${count} run${count===1?'':'s'} skipped; recovery adjustments applied.`);}
function saveLog(fd,editId){const dateVal=String(fd.get('date')||''),id=String(fd.get('workoutId')||''),w=id?st.workouts.find(x=>x.id===id):null;const payload={date:dateVal,workoutId:w?.id||null,title:String(fd.get('title')||'Running session').trim().slice(0,100),type:String(fd.get('type')||'easy'),km:Number(fd.get('km')),elev:Number(fd.get('elev')),stairM:Number(fd.get('stairM'))||0,floors:Number(fd.get('floors'))||0,minutes:Number(fd.get('minutes')),hr:Number(fd.get('hr'))||0,rpe:Number(fd.get('rpe'))||3,notes:String(fd.get('notes')||'').slice(0,1500)};
if(!/^\d{4}-\d{2}-\d{2}$/.test(dateVal)||!payload.title||[payload.km,payload.elev,payload.minutes].some(v=>!Number.isFinite(v)||v<0)||payload.km>150||payload.elev>10000||payload.stairM<0||payload.stairM>5000){toast('Please check the activity fields.',true);return}

if(editId){let a=st.activities.find(x=>x.id===editId);if(!a)return;if(a.workoutId&&a.workoutId!==payload.workoutId){let old=st.workouts.find(w=>w.id===a.workoutId);if(old)old.status='planned'}Object.assign(a,payload)}else{st.activities.push({...payload,id:'a'+Date.now()+Math.random().toString(36).slice(2,7)})}
if(w){w.status='done';w.skipReason='';}persist();closeModal();go('log');toast('Activity saved. Nice work.');}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'TRAILFORGE',version:VERSION,exportedAt:new Date().toISOString(),state:st},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download=`trailforge-david-backup-${today()}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup downloaded. Keep it somewhere safe.');}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{
 const obj=JSON.parse(reader.result),candidate=obj.state||obj;
 if(![2,3].includes(candidate.version)||!Array.isArray(candidate.workouts)||!Array.isArray(candidate.activities)||candidate.workouts.length<80||candidate.workouts.some(x=>typeof x.id!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(x.date)))throw Error('Invalid backup');
 if(!confirm('Import will replace locally saved activities and training. Continue?'))return;
 st=candidate.version===2?migrateV2(candidate):candidate;st.weekDays=st.weekDays||{};
 persist();go('dashboard');toast('Backup imported. '+(candidate.version===2?'Old plan upgraded to flat + StairMaster format.':'Your saved plan restored.'));
 }catch(err){toast('Not a supported TrailForge backup: '+err.message,true);}};reader.readAsText(file);}
let lastImportSummary='';
function parseCSV(text){
 const sep=(text.split(/\r?\n/,1)[0].match(/;/g)||[]).length>(text.split(/\r?\n/,1)[0].match(/,/g)||[]).length?';':',';
 const out=[];let row=[],val='',quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){val+='"';i++;}else quoted=!quoted;}
  else if(c===sep&&!quoted){row.push(val);val='';}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(val);if(row.some(x=>x.trim()))out.push(row);row=[];val='';}
  else val+=c;
 }
 row.push(val);if(row.some(x=>x.trim()))out.push(row);return out;
}
function csvDate(v){
 const s=String(v||'').trim();const isoMatch=s.match(/^(\d{4})-(\d\d)-(\d\d)/);
 if(isoMatch)return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
 const parsed=new Date(s);if(!Number.isFinite(parsed.getTime()))return '';
 return `${parsed.getFullYear()}-${String(parsed.getMonth()+1).padStart(2,'0')}-${String(parsed.getDate()).padStart(2,'0')}`;
}
function numeric(v){const s=String(v??'').replace(/\s/g,'').trim();return Number(s.includes(',')&&!s.includes('.')?s.replace(',','.'):s)||0;}
function stravaImport(file){
 if(!file)return;if(file.size>25*1024*1024){toast('CSV exceeds 25 MB. Choose activities.csv, not your entire archive.',true);return;}
 const reader=new FileReader();reader.onload=()=>{
  try{
   const rows=parseCSV(String(reader.result||'').replace(/^\uFEFF/,''));if(rows.length<2)throw Error('CSV is empty');
   const header=rows[0].map(s=>s.trim().toLowerCase().replace(/[_-]/g,' '));
   const col=(names,last=false)=>{for(const name of names){let idx=[];header.forEach((h,i)=>{if(h===name)idx.push(i)});if(idx.length)return last?idx[idx.length-1]:idx[0];}return -1;};
   const get=(r,names,last=false)=>{let ix=col(names,last);return ix<0?'':String(r[ix]||'').trim();};
   if(col(['activity date','date','start date','datum van activiteit','aktivitätsdatum','aktivitaetsdatum'])<0||col(['activity name','name','title','naam van activiteit','aktivitätsname','aktivitaetsname'])<0)throw Error('Expected Strava activities.csv with Activity Date and Activity Name.');
   const unit=$('#strava-distance-unit')?.value||'meters';
   let added=0,duplicates=0,ignored=0;const examples=[];
   rows.slice(1).forEach(r=>{
    const dt=csvDate(get(r,['activity date','date','start date','datum van activiteit','aktivitätsdatum','aktivitaetsdatum']));
    const title=get(r,['activity name','name','title','naam van activiteit','aktivitätsname','aktivitaetsname'])||'Strava activity';
    const sport=(get(r,['activity type','sport type','type','aktivitätstyp','activiteittype'])).toLowerCase();
    const stair=/stair|stepper/.test(sport+' '+title);
    const running=/run|treadmill|hike/.test(sport);
    if(!stair&&!running){ignored++;return;}if(!dt||dt<'2026-08-01'||dt>RACE_A){ignored++;return;}
    const ext=get(r,['activity id','id','activiteit id','aktivitäts id']);
    // Strava exports often have two Distance columns. Last one is the raw distance in metres.
    const distanceRaw=numeric(get(r,['distance','distance (m)','afstand','entfernung','distanz'],true));
    const km=stair?0:unit==='meters'?distanceRaw/1000:unit==='miles'?distanceRaw*1.609344:distanceRaw;
    const elev=stair?0:numeric(get(r,['elevation gain','total elevation gain','elevation gain (m)','hoogtemeters','höhenmeter','hoehenmeter']));
    const stairM=stair?numeric(get(r,['elevation gain','total elevation gain','hoogtemeters','höhenmeter','hoehenmeter'])):0;
    const seconds=numeric(get(r,['moving time','elapsed time','bewegungszeit','beweegtijd'],true))||numeric(get(r,['elapsed time']));
    const minutes=seconds/60;
    const hr=numeric(get(r,['average heart rate','average heartrate','gemiddelde hartslag','durchschnittliche herzfrequenz']));
    const rpe=numeric(get(r,['perceived exertion','ervaren inspanning','empfundene anstrengung']))||3;
    if(!stair&&(km<=0||km>150)){ignored++;return;}
    if(st.activities.some(a=>(ext&&String(a.externalId)===ext)||(a.date===dt&&a.type===(stair?'stair':a.type)&&Math.abs((a.km||0)-km)<.24&&(stair?Math.abs((a.minutes||0)-minutes)<12:true)))){duplicates++;return;}
    const w=st.workouts.find(x=>x.date===dt&&x.status==='planned'&&isTraining(x)&&x.type===(stair?'stair':x.type)&&!st.activities.some(a=>a.workoutId===x.id)&& (stair?x.type==='stair':x.type!=='stair'));
    const record={id:'strava-'+(ext||Date.now()+'-'+added),source:'strava-csv',externalId:ext||null,date:dt,workoutId:w?.id||null,title,type:stair?'stair':(/trail|hike/.test(sport+' '+title)||elev>300)?'long':'easy',km:nice(km),elev,stairM,floors:0,minutes:Math.round(minutes*100)/100,hr,rpe:Math.max(1,Math.min(10,rpe)),notes:'Imported from Strava export'+(ext?` · https://www.strava.com/activities/${ext}`:'')};
    st.activities.push(record);if(w){w.status='done';w.skipReason='';}added++;if(examples.length<3)examples.push(`${dt}: ${title}`);
   });
   if(!added&&!duplicates)throw Error('No supported running or StairMaster activities found. Check CSV format.');
   lastImportSummary=`Imported ${added} activities; skipped ${duplicates} duplicates and ${ignored} unrelated or invalid rows. ${examples.join(' · ')}`;
   persist();go('log');toast(`${added} new Strava workouts imported. ${duplicates} duplicates skipped.`);
  }catch(err){toast('Strava import failed: '+err.message,true);}
 };reader.readAsText(file);
}

function handleAction(el){const act=el.dataset.action,id=el.dataset.id,dt=el.dataset.date;switch(act){case'theme':st.theme=st.theme==='dark'?'light':'dark';persist();render();break;case'quick-log':go('log');break;case'week-prev':weekN=Math.max(1,weekN-1);render();break;case'week-next':weekN=Math.min(32,weekN+1);render();break;case'open-day':{let xs=workoutOn(dt);let x=xs.find(isTraining)||xs.find(x=>x.type==='strength')||xs[0];if(x)showModal('workout',x.id);else showModal('add');break}case'adjust-week':showModal('scale');break;case'set-days':setTrainingDays(weekN,Number(el.dataset.days));break;case'sick':showModal('sick');break;case'add-workout':showModal('add');break;case'restore-week':showModal('restore');break;case'log-workout':showModal('log',id);break;case'edit-workout':showModal('edit',id);break;case'move-workout':showModal('move',id);break;case'toggle-skip':toggleSkip(id);break;case'undo-done':{let x=st.workouts.find(x=>x.id===id);if(x)x.status='planned';persist();closeModal();render();break}case'move-to':moveWorkout(id,dt);break;case'modal-close':closeModal();break;case'modal-backdrop':closeModal();break;case'scale-shortcut':{let slider=$('#week-scale');if(slider){slider.value=el.dataset.scale;$('#scale-label').textContent=slider.value+'%'}break}case'restore-confirm':{let base=generatePlan(),w=weeks[weekN-1];st.workouts=st.workouts.filter(x=>!(x.date>=w.start&&x.date<=w.end&&x.status!=='done'&&!x.race));for(let x of base.filter(x=>x.week===weekN)){if(x.race||st.workouts.some(y=>y.id===x.id))continue;st.workouts.push(x)}persist();closeModal();render();toast('Week template restored; logged runs were kept.');break}case'jump-week':weekN=Number(el.dataset.week);go('planner');break;case'export':exportBackup();break;case'save-pref':st.preferences.name=$('#athlete-name').value.slice(0,60);st.preferences.notes=$('#personal-notes').value.slice(0,1500);st.theme=$('#theme-choice').value;persist();render();toast('Preferences saved.');break;case'reset':showModal('reset');break;case'reset-confirm':st=newState();persist();weekN=curWeek();closeModal();go('dashboard');toast('Plan restored to defaults.');break;case'delete-log':{if(!confirm('Delete this activity?'))break;let a=st.activities.find(x=>x.id===id);st.activities=st.activities.filter(x=>x.id!==id);if(a?.workoutId){let w=st.workouts.find(x=>x.id===a.workoutId);if(w&&!st.activities.some(x=>x.workoutId===w.id))w.status='planned'}persist();closeModal();render();toast('Activity deleted.');break}}}
function handleSubmit(form){let fd=new FormData(form),id=form.dataset.id;switch(form.dataset.form){case'log':saveLog(fd,form.dataset.editId||'');break;case'edit-workout':{let x=st.workouts.find(x=>x.id===id);if(!x||x.race)break;let d=String(fd.get('date')),km=Number(fd.get('km')),elev=Number(fd.get('elev'));if(d<FIRST||d>RACE_A){toast('Choose a date within the training season.',true);break}if(!Number.isFinite(km)||!Number.isFinite(elev)||km<0||elev<0){toast('Invalid workout target.',true);break}let oldDate=x.date;if(oldDate!==d){const other=st.workouts.find(y=>y.id!==x.id&&y.date===d&&isTraining(y)&&y.status!=='done'&&!y.race);if(other)other.date=oldDate;}Object.assign(x,{title:String(fd.get('title')).slice(0,100),type:String(fd.get('type')),date:d,km,elev,mins:Number(fd.get('mins'))||0,description:String(fd.get('description')).slice(0,1200),stairM:Number(fd.get('stairM'))||0});persist();closeModal();weekN=affectedWeek(d);render();toast(oldDate!==d?'Workout updated and moved.':'Workout updated.');break}case'move':moveWorkout(id,String(fd.get('date')));break;case'adjust-week':{const ratio=Number(fd.get('scale'))/100;if(ratio<.5||ratio>1.2)break;scaleWeek(weekN,ratio);persist();closeModal();render();toast(`Week ${weekN} load adjusted to ${fmt(ratio*100)}%.`);break}case'sick':{let n=Number(fd.get('days')),s=String(fd.get('start'));if(![2,4,7,14].includes(n))break;sickness(s,n);break}case'add-workout':{let d=String(fd.get('date'));if(d<FIRST||d>RACE_A){toast('Select a date within your season.',true);break}let type=String(fd.get('type'));st.workouts.push({id:'custom-'+Date.now(),date:d,week:affectedWeek(d),type,title:String(fd.get('title')).slice(0,100),km:Number(fd.get('km')),elev:Number(fd.get('elev')),description:String(fd.get('description')).slice(0,1200),stairM:Number(fd.get('stairM'))||0,mins:0,race:false,status:'planned',skipReason:''});persist();closeModal();weekN=affectedWeek(d);render();toast('Session added.');break}}}
document.addEventListener('click',ev=>{const nav=ev.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}const open=ev.target.closest('[data-open]');if(open){showModal('workout',open.dataset.open);return}const edit=ev.target.closest('[data-edit-log]');if(edit){showModal('editlog',edit.dataset.editLog);return}const wk=ev.target.closest('[data-week]');if(wk){weekN=Number(wk.dataset.week);go('planner');return}const met=ev.target.closest('[data-chart-metric]');if(met){chartMetric=met.dataset.chartMetric;render();return}const ran=ev.target.closest('[data-chart-range]');if(ran){chartRange=ran.dataset.chartRange;render();return}const act=ev.target.closest('[data-action]');if(act){if(act.dataset.action==='modal-backdrop'&&ev.target!==act)return;handleAction(act)} });
document.addEventListener('submit',ev=>{let f=ev.target.closest('form[data-form]');if(f){ev.preventDefault();handleSubmit(f)}});
document.addEventListener('change',ev=>{if(ev.target.id==='week-choice'){weekN=Number(ev.target.value);render()}if(ev.target.id==='backup-import')importBackup(ev.target.files?.[0]);if(ev.target.id==='strava-import')stravaImport(ev.target.files?.[0]);if(ev.target.classList.contains('activity-kind')){const f=ev.target.closest('form');if(f){const ss=f.querySelector('.stair-entry');if(ss)ss.style.display=ev.target.value==='stair'?'grid':'none';if(ev.target.value==='stair'){const km=f.querySelector('[name=km]'),elev=f.querySelector('[name=elev]');if(km)km.value='0';if(elev)elev.value='0';}}}if(ev.target.dataset.checklist){st.preferences['check_'+ev.target.dataset.checklist]=ev.target.checked;persist();toast('Checklist updated.')}});
document.addEventListener('input',ev=>{if(ev.target.id==='week-scale'){$('#scale-label').textContent=ev.target.value+'%'}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal){closeModal()}if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.day-workout')){ev.preventDefault();showModal('workout',ev.target.dataset.open)}});
render();persist();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
</script></body></html>
